# PostgreSQL Connection
#spring.datasource.url=jdbc:postgresql://192.168.131.101:5432/photo_market
# Desplegamos en el mismo computador el programa y la base de datos 104M01
spring.datasource.url=jdbc:postgresql://localhost:5432/photo_market
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicialización de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
#spring.sql.init.mode=always
# Server port
server.port=8085