<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">PhotoMarket</title>
    <!-- Bootstrap 5 CDN — Persona 3 puede reemplazar con su CSS propio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>


    <div th:fragment="layout" class="container-fluid">
        <div class="row g-0">

            <!-- Sidebar de navegación -->
            <nav class="col-md-2 sidebar py-3 px-2">
                <div class="text-white fw-bold fs-5 mb-4 px-2">
                    <i class="bi bi-camera me-2"></i>PhotoMarket
                </div>
                <ul class="nav flex-column gap-1">
                    <!-- Opciones para ADMIN -->
                    <div sec:authorize="hasRole('ADMIN')">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/users}">
                                <i class="bi bi-people me-2"></i>Usuarios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/roles}">
                                <i class="bi bi-shield-lock me-2"></i>Roles
                            </a>
                        </li>
                    </div>

                    <!-- Opciones para FOTÓGRAFO -->
                    <div sec:authorize="hasRole('PHOTOGRAPHER')">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/photographer/dashboard}">
                                <i class="bi bi-camera me-2"></i>Mis Fotografías
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/sales}">
                                <i class="bi bi-cash-coin me-2"></i>Ventas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/profile}">
                                <i class="bi bi-person-badge me-2"></i>Mi Perfil
                            </a>
                        </li>
                    </div>

                    <!-- Opciones para COMPRADOR -->
                    <div sec:authorize="hasRole('BUYER')">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/buyer/dashboard}">
                                <i class="bi bi-search me-2"></i>Explorar
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/purchases}">
                                <i class="bi bi-bag me-2"></i>Mis Compras
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/favorites}">
                                <i class="bi bi-heart me-2"></i>Favoritos
                            </a>
                        </li>
                    </div>

                    <!-- Opciones para otros roles -->
                    <div sec:authorize="!hasRole('ADMIN') and !hasRole('PHOTOGRAPHER') and !hasRole('BUYER')">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/user/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>Mi Panel
                            </a>
                        </li>
                    </div>
                </ul>

                <!-- Botón de logout en la parte inferior -->
                <div class="mt-auto pt-3 border-top border-secondary">
                    <form th:action="@{/logout}" method="post" class="d-inline" onsubmit="return confirmLogout()">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100 text-start">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </button>
                    </form>
                </div>
            </nav>

            <!-- Contenido principal -->
            <main class="col-md-10 main-content">

                <!-- Toast Container para notificaciones emergentes -->
                <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
                    <!-- Toast de éxito -->
                    <div th:if="${successMessage}" class="toast show" role="alert" aria-live="assertive"
                        aria-atomic="true" id="successToast">
                        <div class="toast-header bg-success text-white">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <strong class="me-auto">Éxito</strong>
                            <small>Ahora</small>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                                aria-label="Close"></button>
                        </div>
                        <div class="toast-body" th:text="${successMessage}">
                            Mensaje de éxito
                        </div>
                    </div>

                    <!-- Toast de error -->
                    <div th:if="${errorMessage}" class="toast show" role="alert" aria-live="assertive"
                        aria-atomic="true" id="errorToast">
                        <div class="toast-header bg-danger text-white">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <strong class="me-auto">Error</strong>
                            <small>Ahora</small>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"
                                aria-label="Close"></button>
                        </div>
                        <div class="toast-body" th:text="${errorMessage}">
                            Mensaje de error
                        </div>
                    </div>
                </div>

                <!-- Aquí se inyecta el contenido de cada vista -->
                <div th:replace="~{::content}">
                    <!-- placeholder reemplazado por la vista hija -->
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function confirmLogout() {
            return confirm('¿Estás seguro de que quieres salir de la aplicación?');
        }

        // Inicializar toasts cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function () {
            // Auto-ocultar toast de éxito después de 4 segundos
            const successToast = document.getElementById('successToast');
            if (successToast) {
                const toast = new bootstrap.Toast(successToast, {
                    autohide: true,
                    delay: 4000
                });
                toast.show();
            }

            // Auto-ocultar toast de error después de 6 segundos
            const errorToast = document.getElementById('errorToast');
            if (errorToast) {
                const toast = new bootstrap.Toast(errorToast, {
                    autohide: true,
                    delay: 6000
                });
                toast.show();
            }
        });
    </script>
</body>

</html>
