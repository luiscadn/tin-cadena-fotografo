<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Registro | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="auth">

<div class="auth-wrap">
    <div class="auth-card card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center">
                <div class="brand">
                    <i class="bi bi-camera fs-4"></i>
                    <h1 class="h4 brand-title">PhotoMarket</h1>
                </div>
                <p class="brand-subtitle">Crea tu cuenta</p>
            </div>

            <div class="mt-4">

                <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input id="username" type="text" class="form-control" th:field="*{username}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" type="email" class="form-control" th:field="*{email}">
                            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="roleId" class="form-label">Tipo de cuenta</label>
                            <select id="roleId" class="form-select" th:field="*{roleId}">
                                <option value="">Seleccionar tipo de cuenta</option>
                                <option th:each="r : ${roles}" 
                                        th:value="${r.id}" 
                                        th:text="${r.name}"
                                        th:if="${r.name != 'ADMIN'}">
                                </option>
                            </select>
                            <small class="text-muted">Los roles administrativos son asignados por administradores existentes</small>
                        </div>

                    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                </form>

                <div class="text-center mt-3">
                    <a class="auth-link" th:href="@{/login}">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
