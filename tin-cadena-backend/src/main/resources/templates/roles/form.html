<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Crear Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{layout :: layout}">

    <!-- Formulario de Creación de Rol -->
    <div th:fragment="content">

        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/roles}" class="btn btn-link text-decoration-none ps-0">
                <i class="bi bi-arrow-left me-1"></i> Volver a Roles
            </a>
            <h1 class="h3 fw-bold mb-0 ms-2">
                <i class="bi bi-shield-plus me-2 text-success"></i>
                Crear Nuevo Rol
            </h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card">
                    <div class="card-body p-4">

                        <form th:action="@{/roles/new}" method="post"
                              id="create-role-form" th:object="${role}">

                            <!-- Nombre del Rol -->
                            <div class="mb-4">
                                <label for="roleName" class="form-label fw-semibold">
                                    Nombre del Rol <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="roleName" name="name"
                                       th:field="*{name}"
                                       class="form-control form-control-lg"
                                       placeholder="Ej: ADMIN, EDITOR, VIEWER"
                                       required>
                                <div class="form-text">Use mayúsculas y sin espacios. Ej: ROLE_ADMIN</div>
                            </div>

                            <!-- Selección de Permisos -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold d-block">
                                    Permisos <span class="text-danger">*</span>
                                    <small class="text-muted fw-normal">(selecciona al menos uno)</small>
                                </label>

                                <div class="row row-cols-1 row-cols-md-2 g-2">
                                    <div th:each="perm : ${allPermissions}" class="col">
                                        <div class="form-check border rounded p-2 h-100">
                                            <input class="form-check-input" type="checkbox"
                                                   name="permissionIds"
                                                   th:id="'perm-check-' + ${perm.id}"
                                                   th:value="${perm.id}">
                                            <label class="form-check-label"
                                                   th:for="'perm-check-' + ${perm.id}">
                                                <i class="bi bi-key me-1 text-secondary"></i>
                                                <span th:text="${perm.name}"></span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <!-- Advertencia si no hay permisos disponibles -->
                                <div th:if="${#lists.isEmpty(allPermissions)}"
                                     class="alert alert-warning mt-2 mb-0">
                                    <i class="bi bi-exclamation-triangle me-1"></i>
                                    No hay permisos disponibles. Crea permisos primero.
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/roles}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" id="btn-create-role"
                                        class="btn btn-success">
                                    <i class="bi bi-shield-check me-1"></i>
                                    Crear Rol
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /content -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
