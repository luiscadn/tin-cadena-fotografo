<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Gestión de Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{layout :: layout}">

    <!-- Vista Listar Roles -->
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">
                <i class="bi bi-shield-fill me-2 text-success"></i>
                Roles del Sistema
            </h1>
            <a th:href="@{/roles/new}" id="btn-new-role"
               class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i> Crear Rol
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">

            <div th:each="role : ${roles}" class="col"
                 th:id="'role-card-' + ${role.id}">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center bg-white">
                        <span class="fw-bold fs-5">
                            <i class="bi bi-shield-check me-1 text-success"></i>
                            <span th:text="${role.name}"></span>
                        </span>
                        <span class="badge bg-secondary rounded-pill"
                              th:text="${#sets.size(role.permissions)} + ' permisos'">
                        </span>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-2">Permisos asignados:</p>
                        <div class="d-flex flex-wrap gap-1">
                            <span th:each="p : ${role.permissions}"
                                  class="badge bg-light text-dark border"
                                  th:text="${p.name}">
                            </span>
                            <span th:if="${#sets.isEmpty(role.permissions)}"
                                  class="text-muted fst-italic small">
                                Sin permisos
                            </span>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 d-flex gap-2">
                        <!-- Gestionar Permisos -->
                        <a th:href="@{/roles/{id}/permissions(id=${role.id})}"
                           th:id="'btn-manage-perms-' + ${role.id}"
                           class="btn btn-sm btn-outline-primary flex-fill">
                            <i class="bi bi-key me-1"></i> Gestionar Permisos
                        </a>
                        <!-- Eliminar Rol -->
                        <form th:action="@{/roles/{id}/delete(id=${role.id})}"
                              method="post"
                              onsubmit="return confirm('¿Eliminar el rol? Los usuarios con este rol perderán la asignación.');">
                            <button type="submit"
                                    th:id="'btn-delete-role-' + ${role.id}"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Eliminar Rol">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Estado vacío -->
            <div th:if="${#lists.isEmpty(roles)}" class="col-12">
                <div class="text-center py-5 text-muted">
                    <i class="bi bi-shield-x fs-1 d-block mb-3"></i>
                    <p>No hay roles creados aún.</p>
                    <a th:href="@{/roles/new}" class="btn btn-success">
                        <i class="bi bi-plus-circle me-1"></i> Crear primer rol
                    </a>
                </div>
            </div>

        </div>

    </div><!-- /content -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
