<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Acceso denegado | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="auth">

<div class="auth-wrap">
    <div class="auth-card card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center">
                <div class="brand">
                    <i class="bi bi-camera fs-4"></i>
                    <h1 class="h4 brand-title">PhotoMarket</h1>
                </div>
                <p class="brand-subtitle">Acceso denegado</p>
            </div>

            <div class="mt-4">
                <div class="alert alert-danger" role="alert">
                    No tienes permisos para acceder a esta sección.
                </div>

                <div class="d-grid gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/login}">Ir a login</a>
                    <a class="btn btn-primary" th:href="@{/users}">Ir al panel</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
