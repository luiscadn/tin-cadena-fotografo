<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Iniciar sesión | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="auth">

<div class="auth-wrap">
    <div class="auth-card card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center">
                <div class="brand">
                    <i class="bi bi-camera fs-4"></i>
                    <h1 class="h4 brand-title">PhotoMarket</h1>
                </div>
                <p class="brand-subtitle">Accede a tu panel de gestión</p>
            </div>

            <div class="mt-4">
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Usuario o contraseña inválidos.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Entrar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a class="auth-link" th:href="@{/register}">Crear una cuenta</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
