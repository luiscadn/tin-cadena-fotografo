<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Panel Comprador | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{layout :: layout}">

    <div th:fragment="content">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h3 fw-bold mb-0">
                        <i class="bi bi-cart-fill me-2 text-success"></i>
                        Panel Comprador
                    </h1>
                    <div class="text-muted">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${username}">Usuario</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Tarjeta de explorar -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-search fs-1 text-primary mb-3"></i>
                        <h5 class="card-title">Explorar</h5>
                        <p class="card-text text-muted">Descubre nuevas fotografías</p>
                        <a href="/explore" class="btn btn-primary">
                            <i class="bi bi-compass me-1"></i>Explorar Tienda
                        </a>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de compras -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-bag-fill fs-1 text-success mb-3"></i>
                        <h5 class="card-title">Mis Compras</h5>
                        <p class="card-text text-muted">Revisa tus adquisiciones</p>
                        <a href="/purchases" class="btn btn-success">
                            <i class="bi bi-receipt me-1"></i>Ver Compras
                        </a>
                    </div>
                </div>
            </div>

            <!-- Tarjeta de favoritos -->
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-heart-fill fs-1 text-danger mb-3"></i>
                        <h5 class="card-title">Favoritos</h5>
                        <p class="card-text text-muted">Tus fotografías preferidas</p>
                        <a href="/favorites" class="btn btn-danger">
                            <i class="bi bi-star me-1"></i>Ver Favoritos
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección de recomendaciones -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-stars me-2"></i>
                            Recomendados para Ti
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center text-muted py-4">
                            <i class="bi bi-magic fs-1 d-block mb-2"></i>
                            <p>Basado en tus intereses</p>
                            <small>Explora más fotografías para obtener recomendaciones personalizadas</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
