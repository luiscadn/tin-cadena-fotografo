<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Mi Panel | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{layout :: layout}">

        <div th:fragment="content">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1 class="h3 fw-bold mb-0">
                            <i class="bi bi-speedometer2 me-2 text-info"></i>
                            Mi Panel
                        </h1>
                        <div class="text-muted">
                            <i class="bi bi-person-circle me-1"></i>
                            <span th:text="${username}">Usuario</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Tarjeta de perfil -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-person-badge fs-1 text-primary mb-3"></i>
                            <h5 class="card-title">Mi Perfil</h5>
                            <p class="card-text text-muted">Gestiona tu información personal</p>
                            <a href="/profile" class="btn btn-primary">
                                <i class="bi bi-pencil me-1"></i>Editar Perfil
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Tarjeta de actividad -->
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="bi bi-clock-history fs-1 text-info mb-3"></i>
                            <h5 class="card-title">Mi Actividad</h5>
                            <p class="card-text text-muted">Revisa tu historial reciente</p>
                            <a href="/activity" class="btn btn-info">
                                <i class="bi bi-list-ul me-1"></i>Ver Actividad
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección de bienvenida -->
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="bi bi-house-heart me-2"></i>
                                Bienvenido a PhotoMarket
                            </h5>
                        </div>
                        <div class="card-body text-center">
                            <i class="bi bi-image fs-1 d-block mb-3 text-muted"></i>
                            <h4 class="text-primary">¡Hola <span th:text="${username}">Usuario</span>!</h4>
                            <p class="text-muted">Tu rol está siendo configurado. Pronto tendrás acceso a todas las
                                funcionalidades.</p>
                            <div class="mt-3">
                                <a href="/explore" class="btn btn-outline-primary me-2">
                                    <i class="bi bi-compass me-1"></i>Explorar
                                </a>
                                <a href="/help" class="btn btn-outline-secondary">
                                    <i class="bi bi-question-circle me-1"></i>Ayuda
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
