<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Asignar Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{layout :: layout}">

    <!-- Vista: Asignar Rol a un Usuario -->
    <div th:fragment="content">

        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/users}" class="btn btn-link text-decoration-none ps-0">
                <i class="bi bi-arrow-left me-1"></i> Volver a Usuarios
            </a>
            <h1 class="h3 fw-bold mb-0 ms-2">
                <i class="bi bi-shield-lock-fill me-2 text-secondary"></i>
                Asignar Rol a Usuario
            </h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Información del usuario -->
                <div class="card mb-4 border-0 bg-dark text-white">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center"
                             style="width:56px; height:56px;">
                            <i class="bi bi-person-fill fs-3"></i>
                        </div>
                        <div>
                            <div class="fw-bold fs-5" th:text="${user.name}">Nombre</div>
                            <div class="text-light opacity-75">
                                <code class="text-white" th:text="'@' + ${user.username}"></code>
                            </div>
                            <span class="badge bg-info text-dark mt-1"
                                  th:text="'Rol actual: ' + ${user.role?.name}">Sin rol</span>
                        </div>
                    </div>
                </div>

                <!-- Formulario de cambio de rol -->
                <div class="card">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3">Seleccionar nuevo rol</h5>

                        <form th:action="@{/users/{id}/assign-role(id=${user.id})}"
                              method="post" id="assign-role-form">

                            <div class="mb-4">
                                <!-- Lista de roles como radio buttons -->
                                <div th:each="r : ${roles}"
                                     class="form-check border rounded p-3 mb-2"
                                     th:classappend="${r.id == user.role?.id} ? 'border-primary bg-primary bg-opacity-10' : ''">
                                    <input class="form-check-input" type="radio"
                                           name="roleId"
                                           th:id="'role-' + ${r.id}"
                                           th:value="${r.id}"
                                           th:checked="${r.id == user.role?.id}"
                                           required>
                                    <label class="form-check-label w-100"
                                           th:for="'role-' + ${r.id}">
                                        <span class="fw-semibold" th:text="${r.name}"></span>
                                        <div class="mt-1">
                                            <span th:each="p : ${r.permissions}"
                                                  class="badge bg-secondary me-1"
                                                  th:text="${p.name}">
                                            </span>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/users}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" id="btn-save-role"
                                        class="btn btn-primary">
                                    <i class="bi bi-floppy me-1"></i> Guardar Cambio
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>

    </div><!-- /content -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
