<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Usuarios | PhotoMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{layout :: layout}">

    <!-- Vista Listar Usuarios — fragmento "content" -->
    <div th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">
                <i class="bi bi-people-fill me-2 text-primary"></i>
                Usuarios del Sistema
            </h1>
            <a th:href="@{/users/new}" id="btn-new-user"
               class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i> Registrar Usuario
            </a>
        </div>

        <!-- Tabla de usuarios -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0" id="users-table">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Email</th>
                            <th>Rol Actual</th>
                            <th>Creado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}" th:id="'user-row-' + ${user.id}">
                            <td th:text="${user.id}" class="text-muted"></td>
                            <td th:text="${user.name}" class="fw-semibold"></td>
                            <td>
                                <code th:text="${user.username}"></code>
                            </td>
                            <td th:text="${user.email}"></td>
                            <td>
                                <span class="badge bg-info text-dark"
                                      th:text="${user.role?.name}">Sin rol</span>
                            </td>
                            <td>
                                <small class="text-muted"
                                       th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">
                                </small>
                            </td>
                            <td class="text-center">
                                <!-- Asignar Rol -->
                                <a th:href="@{/users/{id}/assign-role(id=${user.id})}"
                                   th:id="'btn-assign-role-' + ${user.id}"
                                   class="btn btn-sm btn-outline-secondary me-1"
                                   title="Cambiar Rol">
                                    <i class="bi bi-shield-lock"></i>
                                </a>
                                <!-- Eliminar Usuario -->
                                <form th:action="@{/users/{id}/delete(id=${user.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('¿Eliminar usuario?');">
                                    <button type="submit"
                                            th:id="'btn-delete-user-' + ${user.id}"
                                            class="btn btn-sm btn-outline-danger"
                                            title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <!-- Estado vacío -->
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                No hay usuarios registrados.
                                <a th:href="@{/users/new}">Crear el primero</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div><!-- /content -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
