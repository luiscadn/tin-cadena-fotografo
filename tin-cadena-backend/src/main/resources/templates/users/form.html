<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | PhotoMarket'">Registrar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{layout :: layout}">

    <!-- Formulario de Registro de Usuario -->
    <div th:fragment="content">

        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/users}" class="btn btn-link text-decoration-none ps-0">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
            <h1 class="h3 fw-bold mb-0 ms-2">
                <i class="bi bi-person-plus-fill me-2 text-primary"></i>
                Registrar Nuevo Usuario
            </h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card">
                    <div class="card-body p-4">

                        <form th:action="@{/users/new}" method="post"
                              id="user-registration-form" th:object="${user}">

                            <!-- Nombre completo -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Nombre Completo <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="name" name="name"
                                       th:field="*{name}"
                                       class="form-control"
                                       placeholder="Ej: Juan Pérez"
                                       required>
                            </div>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">
                                    Nombre de Usuario <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                                    <input type="text" id="username" name="username"
                                           th:field="*{username}"
                                           class="form-control"
                                           placeholder="juanperez123"
                                           required>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Email
                                </label>
                                <input type="email" id="email" name="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="juan@example.com">
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    Contraseña <span class="text-danger">*</span>
                                </label>
                                <input type="password" id="password" name="password"
                                       th:field="*{password}"
                                       class="form-control"
                                       placeholder="Mínimo 6 caracteres"
                                       required>
                            </div>

                            <!-- Selección de Rol -->
                            <div class="mb-4">
                                <label for="roleId" class="form-label fw-semibold">
                                    Rol Inicial <span class="text-danger">*</span>
                                </label>
                                <select id="roleId" name="roleId"
                                        class="form-select" required>
                                    <option value="" disabled selected>-- Selecciona un rol --</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.id}"
                                            th:text="${r.name}">
                                    </option>
                                </select>
                                <div class="form-text">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Todo usuario debe tener al menos un rol asignado.
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/users}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" id="btn-submit-user"
                                        class="btn btn-primary">
                                    <i class="bi bi-person-check me-1"></i>
                                    Registrar Usuario
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /content -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
